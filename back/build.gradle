plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'com.adarshr.test-logger' version '4.0.0'
	// Analyse statique Java : détecte les bug patterns (NPE, equals(), etc.)
	id 'com.github.spotbugs' version '6.0.9'
	// Couverture de code : génère les rapports XML + HTML (utilisés par GitLab CI)
	id 'jacoco'
}

group = 'com.openclassroom.devops.orion'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'ro.polak:spring-boot-data-fixtures:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	runtimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ==============================================================================
// TESTS — JUnit 5 + JaCoCo (couverture)
// ==============================================================================
test {
	useJUnitPlatform()
	// Lance le rapport JaCoCo automatiquement après chaque exécution des tests
	finalizedBy jacocoTestReport
}

// ==============================================================================
// JACOCO — Rapport de couverture de code
// ==============================================================================
jacoco {
	toolVersion = '0.8.11'
}

jacocoTestReport {
	// Dépend explicitement de 'test' pour garantir l'ordre d'exécution
	dependsOn test
	reports {
		// XML requis pour l'intégration GitLab CI (regex couverture + dashboard)
		xml.required = true
		// HTML pour consultation locale dans back/build/reports/jacoco/test/html/
		html.required = true
	}
}

// ==============================================================================
// SPOTBUGS — Analyse statique (lint Java)
// ==============================================================================
spotbugs {
	// false = le build échoue si SpotBugs trouve des problèmes (bloquant en CI)
	ignoreFailures = false
	// Niveau d'effort : max = analyse la plus approfondie
	effort = 'default'
	// Niveau de confiance des rapports : MEDIUM = signale les vrais problèmes
	reportLevel = 'medium'
	// Exclure les faux positifs connus (à créer si nécessaire)
	// excludeFilter = file("spotbugs-exclude.xml")
}

// Rapport HTML lisible + XML pour intégration CI
spotbugsMain {
	reports {
		xml.required = true
		html.required = true
	}
}

spotbugsTest {
	reports {
		xml.required = true
		html.required = true
	}
}
